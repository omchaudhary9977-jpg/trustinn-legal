<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrustInn — Legal</title>
<style>
  :root {
    --ink: #0F1B2D;
    --text: #1a1a1a;
    --muted: #5b6472;
    --border: #e5e7eb;
    --accent: #4776E6;
    --bg: #ffffff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: inherit; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px 96px; }
  header { margin-bottom: 40px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, #4776E6, #EE4B8C);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 16px;
  }
  .brand-name { font-weight: 700; font-size: 18px; color: var(--ink); }
  h1 { font-size: 28px; color: var(--ink); margin: 0 0 8px; }
  .updated { color: var(--muted); font-size: 14px; margin: 0; }
  .notice {
    background: #fff8e6; border: 1px solid #f3d98b; border-radius: 10px;
    padding: 14px 16px; font-size: 13.5px; color: #6b5216; margin: 24px 0 40px;
  }
  h2 { font-size: 19px; color: var(--ink); margin: 36px 0 12px; }
  h3 { font-size: 15.5px; color: var(--ink); margin: 20px 0 8px; }
  p, li { font-size: 15px; color: #333; }
  ul { padding-left: 20px; }
  li { margin-bottom: 6px; }
  a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border: 1px solid var(--border); }
  th { background: #f8f9fb; color: var(--ink); }
  .placeholder { background: #fff1f0; color: #c0392b; padding: 1px 5px; border-radius: 4px; font-size: 13.5px; }
  footer { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
</style>
<style>.list a{display:block;padding:16px 18px;margin:10px 0;border:1px solid #e5e7eb;border-radius:12px;text-decoration:none;color:#0F1B2D;font-weight:600}.list a:hover{border-color:#4776E6}</style></head>
<body><div class="wrap">
<header><div class="brand"><div class="brand-mark">T</div><div class="brand-name">TrustInn</div></div>
<h1>Legal &amp; Policies</h1>
<p class="updated">Policies for the TrustInn app, a product of RedBirdz.</p></header>
<div class="list">
<a href="terms-of-service.html">Terms of Service</a>
<a href="privacy-policy.html">Privacy Policy</a>
<a href="content-policy.html">Content Policy</a>
<a href="partner-safety.html">Partner Safety &amp; Responsibility</a>
<a href="delete-account.html">Delete your account</a>
</div>
<footer>Contact: <a href="mailto:trustinnsupport@gmail.com">trustinnsupport@gmail.com</a></footer>
</div>
</body>
</html>
